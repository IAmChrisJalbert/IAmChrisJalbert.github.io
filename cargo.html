<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simply Air Cargo - Global Routing Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 900px; margin: auto; display: flex; flex-direction: column; min-height: 100vh; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; margin-top: 15px; position: relative; z-index: 10; }
        
        label { display: block; font-size: 13px; color: #aaa; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, button { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: #007acc; }
        
        button { background: #007acc; cursor: pointer; font-weight: bold; margin-top: 20px; transition: background 0.2s; }
        button:hover { background: #005999; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }

        .input-row { display: flex; gap: 15px; margin-top: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        
        .route-card { background: #252525; padding: 18px; margin-top: 15px; border-radius: 6px; border-left: 4px solid #4CAF50; }
        .airline-name { font-size: 17px; font-weight: bold; color: #4CAF50; }
        .dest-label { font-size: 15px; color: #ffeb3b; font-weight: bold; margin-top: 2px; }
        .plane-section { margin-top: 10px; background: #2c2c2c; padding: 12px; border-radius: 4px; border: 1px solid #383838; }
        .plane-title { font-size: 14px; font-weight: bold; color: #00bcd4; margin-bottom: 6px; }
        .specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; font-size: 13px; color: #ccc; }
        .specs-item { background: #222; padding: 6px 10px; border-radius: 3px; border: 1px solid #333; }
        .specs-item span { color: #fff; font-weight: bold; }

        #status { background: #2a2a2a; border-left: 4px solid #00bcd4; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-weight: bold; font-size: 14px; }

        @media (max-width: 600px) {
            .input-row { flex-direction: column; gap: 15px; }
            .specs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h2 style="margin-bottom: 5px;">Simply Air Cargo</h2>
        <p style="color: #aaa; margin-top: 0;">Direct & Hub-Routing Master Database with Aircraft Cargo Limitations</p>
    </div>

    <div class="box">
        <div id="status">Loading master routes and equipment specifications...</div>

        <div class="input-row">
            <div class="input-group">
                <label for="origin">Origin Airport</label>
                <input type="text" id="origin" placeholder="e.g., BOS, EWR, DFW, LAX..." value="BOS">
            </div>
            
            <div class="input-group">
                <label for="dest">Destination Airport</label>
                <input type="text" id="dest" placeholder="e.g., DUB, NRT, FRA...">
            </div>
        </div>

        <button onclick="searchMasterRoutes()" id="searchBtn" disabled>Loading Database...</button>
    </div>

    <div id="results"></div>

    <script>
        let masterRoutingDb = {};
        let equipmentDb = {};

        async function initServerDatabase() {
            const statusEl = document.getElementById('status');
            const btnEl = document.getElementById('searchBtn');

            try {
                const [routesRes, equipRes] = await Promise.all([
                    fetch('Master_Routes.json'),
                    fetch('Master_Equipment_Database.json')
                ]);

                if (!routesRes.ok) throw new Error('Failed to load Master_Routes.json');
                if (!equipRes.ok) throw new Error('Failed to load Master_Equipment_Database.json');

                const rows = await routesRes.json();
                const equipRows = await equipRes.json();

                equipmentDb = {};
                equipRows.forEach(d => {
                    const eqKey = String(d['Aircraft Type / Equipment'] || '').trim().toUpperCase();
                    equipmentDb[eqKey] = {
                        length: d['Max Cargo Length (in)'] ?? 'N/A',
                        width: d['Max Cargo Width (in)'] ?? 'N/A',
                        height: d['Max Cargo Height (in)'] ?? 'N/A',
                        door: d['Max Dimensions / Cargo Door Size'] || 'N/A',
                        weight: d['Max Weight Capacity'] || 'N/A',
                        volume: d['Max Volume Capacity'] || 'N/A'
                    };
                });

                masterRoutingDb = {};
                rows.forEach(row => {
                    const org = String(row['Origin'] || '').trim().toUpperCase();
                    const destRaw = String(row['Destination'] || '').trim();
                    const airline = String(row['Airline'] || '').trim();
                    const plane = String(row['Plane Type'] || '').trim();

                    let destCode = destRaw.substring(0, 3).toUpperCase();
                    const match = destRaw.match(/\(([A-Z]{3})\)/);
                    if (match) {
                        destCode = match[1];
                    }

                    if (org && destCode) {
                        if (!masterRoutingDb[org]) masterRoutingDb[org] = {};
                        if (!masterRoutingDb[org][destCode]) masterRoutingDb[org][destCode] = [];

                        masterRoutingDb[org][destCode].push({
                            airline: airline,
                            destinationFull: destRaw,
                            planeType: plane
                        });
                    }
                });

                statusEl.innerText = `Database synchronized! (${rows.length.toLocaleString()} routes & ${equipRows.length} equipment specs loaded).`;
                statusEl.style.borderLeftColor = "#4CAF50";
                btnEl.disabled = false;
                btnEl.innerText = "Search Routes & Equipment Specs";

            } catch (err) {
                console.error(err);
                statusEl.innerHTML = `⚠️ Failed to load database files. Ensure Master_Routes.json and Master_Equipment_Database.json are in your root directory.`;
                statusEl.style.borderLeftColor = "#ff6b6b";
            }
        }

        function findEquipmentSpecs(planeName) {
            const cleanName = planeName.trim().toUpperCase();
            if (equipmentDb[cleanName]) return equipmentDb[cleanName];

            for (let key in equipmentDb) {
                if (cleanName.includes(key) || key.includes(cleanName)) {
                    return equipmentDb[key];
                }
            }

            return {
                length: 'N/A',
                width: 'N/A',
                height: 'N/A',
                door: 'Standard Door',
                weight: 'Standard Capacity',
                volume: 'Standard Volume'
            };
        }

        function searchMasterRoutes() {
            const org = document.getElementById('origin').value.toUpperCase().trim();
            const dst = document.getElementById('dest').value.toUpperCase().trim();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "";

            if (!org || !dst) {
                resultsDiv.innerHTML = "<p style='color:#ff6b6b; margin-top:15px; text-align: center;'>Please enter both Origin and Destination codes.</p>";
                return;
            }

            if (!masterRoutingDb[org] || !masterRoutingDb[org][dst]) {
                resultsDiv.innerHTML = `<p style='margin-top:20px; color:#ff8a80; text-align: center;'>No routes found from <strong>${org}</strong> to destination code <strong>${dst}</strong>.</p>`;
                return;
            }

            const routes = masterRoutingDb[org][dst];

            routes.forEach(r => {
                const planes = r.planeType.split('/').map(p => p.trim()).filter(p => p.length > 0);

                let planesHtml = "";
                planes.forEach(p => {
                    const specs = findEquipmentSpecs(p);
                    planesHtml += `
                        <div class="plane-section">
                            <div class="plane-title">✈️ Option: ${p}</div>
                            <div class="specs-grid">
                                <div class="specs-item">Max Length: <span>${specs.length} in</span></div>
                                <div class="specs-item">Max Width: <span>${specs.width} in</span></div>
                                <div class="specs-item">Max Height: <span>${specs.height} in</span></div>
                                <div class="specs-item">Door Size: <span>${specs.door}</span></div>
                                <div class="specs-item">Max Weight: <span>${specs.weight}</span></div>
                                <div class="specs-item">Max Volume: <span>${specs.volume}</span></div>
                            </div>
                        </div>
                    `;
                });

                resultsDiv.innerHTML += `
                    <div class="route-card">
                        <div class="airline-name">${r.airline}</div>
                        <div class="dest-label">Routing: ${org} ➔ ${r.destinationFull}</div>
                        ${planesHtml}
                    </div>
                `;
            });
        }

        window.onload = initServerDatabase;

        document.getElementById('origin').addEventListener('keypress', function(e) { if(e.key === 'Enter') searchMasterRoutes(); });
        document.getElementById('dest').addEventListener('keypress', function(e) { if(e.key === 'Enter') searchMasterRoutes(); });
    </script>

    <footer class="border-t border-white/5 py-8 px-6 mt-auto text-center flex flex-col items-center gap-4">

        <p class="text-xs font-medium text-slate-600 tracking-widest">

        </p>
    </footer>

</body>
</html>
