<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simply Air Cargo - Global Routing Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 800px; margin: auto; display: flex; flex-direction: column; min-height: 100vh; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; margin-top: 15px; position: relative; z-index: 10; }
        
        label { display: block; font-size: 13px; color: #aaa; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, button { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: #007acc; }
        
        button { background: #007acc; cursor: pointer; font-weight: bold; margin-top: 20px; transition: background 0.2s; }
        button:hover { background: #005999; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }

        .input-row { display: flex; gap: 15px; margin-top: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        
        .route-card { background: #252525; padding: 15px; margin-top: 12px; border-radius: 6px; border-left: 4px solid #4CAF50; }
        .airline-name { font-size: 16px; font-weight: bold; color: #4CAF50; }
        .plane-type { font-size: 13px; color: #aaa; margin-top: 4px; }
        .dest-label { font-size: 14px; color: #ffeb3b; font-weight: bold; }
        
        #status { background: #2a2a2a; border-left: 4px solid #00bcd4; padding: 12px; margin-bottom: 20px; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .error-link { color: #ff8a80; text-decoration: underline; font-weight: bold; }

        @media (max-width: 600px) {
            .input-row { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h2 style="margin-bottom: 5px;">Simply Air Cargo</h2>
        <p style="color: #aaa; margin-top: 0;">Direct & Hub-Routing Master Database</p>
    </div>

    <div class="box">
        <div id="status">Loading master routes from server...</div>

        <div class="input-row">
            <div class="input-group">
                <label for="origin">Origin Airport</label>
                <input type="text" id="origin" value="BOS" placeholder="e.g., BOS">
            </div>
            
            <div class="input-group">
                <label for="dest">Destination Airport</label>
                <input type="text" id="dest" placeholder="e.g., DUB, NRT, FRA...">
            </div>
        </div>

        <button onclick="searchMasterRoutes()" id="searchBtn" disabled>Loading Database...</button>
    </div>

    <div id="results"></div>

    <script>
        let masterRoutingDb = {};

        async function initServerDatabase() {
            const statusEl = document.getElementById('status');
            const btnEl = document.getElementById('searchBtn');

            try {
                // Fetching native JSON is exponentially faster than parsing Excel
                const response = await fetch('Master_Routes.json');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const rows = await response.json();
                masterRoutingDb = {};

                rows.forEach(row => {
                    const org = String(row['Origin'] || '').trim().toUpperCase();
                    const destRaw = String(row['Destination'] || '').trim();
                    const airline = String(row['Airline'] || '').trim();
                    const plane = String(row['Plane Type'] || '').trim();

                    let destCode = destRaw.substring(0, 3).toUpperCase();
                    const match = destRaw.match(/\(([A-Z]{3})\)/);
                    if (match) {
                        destCode = match[1];
                    }

                    if (org && destCode) {
                        if (!masterRoutingDb[org]) masterRoutingDb[org] = {};
                        if (!masterRoutingDb[org][destCode]) masterRoutingDb[org][destCode] = [];

                        masterRoutingDb[org][destCode].push({
                            airline: airline,
                            destinationFull: destRaw,
                            planeType: plane
                        });
                    }
                });

                statusEl.innerText = `Database synchronized! (${rows.length.toLocaleString()} routes loaded).`;
                statusEl.style.borderLeftColor = "#4CAF50";
                btnEl.disabled = false;
                btnEl.innerText = "Search Routes & Aircraft";

            } catch (err) {
                console.error(err);
                statusEl.innerHTML = `⚠️ Failed to load routing database. Check console (F12) for details.`;
                statusEl.style.borderLeftColor = "#ff6b6b";
            }
        }

        function searchMasterRoutes() {
            const org = document.getElementById('origin').value.toUpperCase().trim();
            const dst = document.getElementById('dest').value.toUpperCase().trim();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "";

            if (!org || !dst) {
                resultsDiv.innerHTML = "<p style='color:#ff6b6b; margin-top:15px; text-align: center;'>Please enter both Origin and Destination codes.</p>";
                return;
            }

            if (!masterRoutingDb[org] || !masterRoutingDb[org][dst]) {
                resultsDiv.innerHTML = `<p style='margin-top:20px; color:#ff8a80; text-align: center;'>No routes found from <strong>${org}</strong> to destination code <strong>${dst}</strong>.</p>`;
                return;
            }

            const routes = masterRoutingDb[org][dst];

            routes.forEach(r => {
                resultsDiv.innerHTML += `
                    <div class="route-card">
                        <div class="airline-name">${r.airline}</div>
                        <div class="dest-label">Routing: ${org} ➔ ${r.destinationFull}</div>
                        <div class="plane-type">Aircraft / Equipment: ${r.planeType}</div>
                    </div>
                `;
            });
        }

        window.onload = initServerDatabase;

        document.getElementById('origin').addEventListener('keypress', function(e) { if(e.key === 'Enter') searchMasterRoutes(); });
        document.getElementById('dest').addEventListener('keypress', function(e) { if(e.key === 'Enter') searchMasterRoutes(); });
    </script>

    <footer class="border-t border-white/5 py-12 px-6 mt-auto">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <p class="text-xs font-medium text-slate-600 tracking-widest text-center md:text-left">
                © 2026 Christopher Jalbert (IAmChrisJalbert) | Privacy-First Apps | Built in Gloucester, MA ⚓
            </p>
        </div>
    </footer>

</body>
</html>
